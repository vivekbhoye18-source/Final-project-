name: Build & Release WardForms APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release with the compiled APK"
        type: boolean
        default: true
      release_tag:
        description: "Release tag name (used when publishing via manual run)"
        type: string
        default: "v1.0.0"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Restored debug.keystore from GitHub secret."
          elif [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback CI debug.keystore."
          fi

      - name: Restore google-services.json from secret if absent
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GitHub secret."
          fi

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/WardForms-debug.apk
          ls -lh release-artifacts/WardForms-debug.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WardForms-debug-apk
          path: release-artifacts/WardForms-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: "WardForms ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
          generate_release_notes: true
          files: |
            release-artifacts/WardForms-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
